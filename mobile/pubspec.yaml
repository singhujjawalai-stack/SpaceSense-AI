name: spacesense
description: AI-powered room analysis app
version: 1.1.0+2
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network
  http: ^1.1.0
  dio: ^5.4.0
  url_launcher: ^6.2.0

  # Supabase
  supabase_flutter: ^2.0.0

  # Local storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Image handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # UI components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

  # Logging
  logger: ^2.0.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  riverpod_lint: ^2.3.7
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  adaptive_icon_background: "assets/icon/app_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
